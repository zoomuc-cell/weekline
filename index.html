<style>
/* Layout: one phone-width column, cards on paper ground, fixed bottom tab bar. Paper planner digitized: ivory paper, deep forest-green ink for progress. */
:root{
  --bg:#F5F3EC; --card:#FFFFFF; --ink:#1B2420; --muted:#5B635E; --line:#E2DED3; --line2:#EFECE4;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{

  --accent-mid:#3A6C57; --warn-bg:#3A2C19; --warn-fg:#E8BC82; --grid:#2B3430; --outline:#6E7A74; --travel:#4A3A22; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
input[type=checkbox],input[type=range]{accent-color:var(--accent)}

.sub{margin:0;color:var(--muted);font-size:14px}

.label{font-size:13px;font-weight:600;color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

.num{font-variant-numeric:tabular-nums}

.ring>div{width:84px;height:84px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}

.seg{display:grid;gap:6px}

.linkcard{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;min-height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);text-decoration:none;border:none;width:100%;text-align:left}

.field{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--field)}
.days7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dcol{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:12px}
.dcol.today{background:var(--accent-soft)}

.legend{display:flex;gap:16px;font-size:12px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.ln{width:16px;height:0;border-top:2px solid var(--accent)} .ln.dash{border-top:2px dashed var(--outline)} .ln.thin{border-top:1px solid var(--outline)}
.list>div{display:grid;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line2)}
.empty{padding:22px 18px;border:1px dashed var(--line);border-radius:18px;color:var(--muted);font-size:14px;line-height:1.6;background:var(--card)}
.heat{display:grid;grid-template-columns:40px repeat(7,minmax(0,1fr));gap:6px;align-items:center}
.heat i{height:28px;border-radius:8px;display:block}
.trend{display:grid;gap:10px;align-items:end;height:130px}

.trend i{display:block;width:28px;border-radius:6px 6px 2px 2px}
.timeline{position:relative;height:672px}
.timeline .hr{position:absolute;left:0;right:0;border-top:1px solid var(--line2)}
.timeline .hr span{position:absolute;left:0;top:-9px;font-size:11px;color:var(--muted);background:var(--card);padding-right:4px}

.blk.p{background:var(--accent-soft);border:1px solid var(--accent)}

.gapbtn{position:absolute;left:48px;right:4px;border:1px dashed var(--accent);border-radius:10px;background:var(--card);color:var(--accent);font-size:12px;font-weight:600;padding:0}

.tabs{zoom:var(--zoom,1);position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}

.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;text-decoration:none;color:var(--muted);font-size:11px}

.tabs a.fab{color:var(--accent);font-weight:600;justify-content:flex-end}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90vw}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;font-size:13px;font-weight:600;color:var(--accent);background:none;border:none;padding:0}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.pill.good{background:var(--accent-soft);color:var(--accent)} .pill.mid{background:var(--soft);color:var(--ink)} .pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
.stat{padding:14px 16px;background:var(--card);border-radius:18px;border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.stat b{font-size:24px;font-weight:600;line-height:1.15}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.flow{display:grid;grid-template-columns:minmax(0,1fr) 16px minmax(0,1fr) 16px minmax(0,1fr);gap:4px;align-items:center}
.flow>div{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:14px;background:var(--soft)}

.flow b{font-size:20px;font-weight:600}
.find{padding:14px;border-radius:18px;border:2px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:10px}

.mbars{display:grid;gap:4px;align-items:end;height:120px}
.mbars>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:120px;font-size:10px}

@media (prefers-reduced-motion:no-preference){.bar>i,.vbar>i{transition:width .3s,height .3s}}
</style>

<script>
/* Local storage with the same interface the artifact db offered: collection().onSnapshot, doc().set/update/delete. */
(function(){
  var P='wl:db:',subs={};
  function all(col){var out=[],pre=P+col+'/';for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(pre)===0){try{out.push({id:k.slice(pre.length),v:JSON.parse(localStorage.getItem(k))});}catch(e){}}}return out;}
  function snap(col){return {docs:all(col).map(function(x){return {id:x.id,data:function(){return x.v;}};})};}
  function emit(col){(subs[col]||[]).forEach(function(f){try{f(snap(col));}catch(e){}});}
  function read(path){try{return JSON.parse(localStorage.getItem(P+path)||'null');}catch(e){return null;}}
  function write(path,val){
    try{if(val===null)localStorage.removeItem(P+path);else localStorage.setItem(P+path,JSON.stringify(val));}
    catch(e){var err=new Error('write failed');err.code=(e&&(e.name==='QuotaExceededError'||e.code===22))?'quota_exceeded':'write_failed';return Promise.reject(err);}
    var col=path.split('/')[0];setTimeout(function(){emit(col);},0);return Promise.resolve();
  }
  var db={
    collection:function(col){return {onSnapshot:function(ok){(subs[col]=subs[col]||[]).push(ok);setTimeout(function(){ok(snap(col));},0);return function(){subs[col]=(subs[col]||[]).filter(function(f){return f!==ok;});};}};},
    doc:function(path){return {
      set:function(d){return write(path,d);},
      update:function(d){return write(path,Object.assign(read(path)||{},d));},
      delete:function(){return write(path,null);}
    };}
  };
  var ok=true;try{localStorage.setItem('wl:probe','1');localStorage.removeItem('wl:probe');}catch(e){ok=false;}
  window.addEventListener('storage',function(e){if(e.key&&e.key.indexOf(P)===0)emit(e.key.slice(P.length).split('/')[0]);});
  window.WL={P:P,emit:emit};
  window.claude={use:function(n){return Promise.resolve(n==='db'&&ok?db:null);}};
})();
</script>

function wd(d){return (d.getUTCDay()+6)%7;} /* Mon=0 */
function isoWeek(d){var t=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));var day=wd(t);var th=addDays(t,3-day);var y=th.getUTCFullYear();var w=1+Math.floor((th-Date.UTC(y,0,1))/864e5/7);return {id:y+'-W'+String(w).padStart(2,'0'),week:w,year:y,monday:addDays(t,-day)};}
function md(d){return (d.getUTCMonth()+1)+'/'+d.getUTCDate();}
function dayLabel(s){var d=parseYmd(s);return DAYN[wd(d)]+' '+md(d);}
function todayStr(){return ymd(kstNow());}
function curWeek(){return isoWeek(parseYmd(todayStr()));}
function nextWeekOf(id){var w=Object.values(S.weeks).find(function(x){return x.id===id;});var mon=w&&w.monday?parseYmd(w.monday):curWeek().monday;return isoWeek(addDays(mon,7));}
function uid(){return Math.random().toString(36).slice(2,9);}
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){el.hidden=true;},2600);}
function pct(a,b){return b?Math.round(a/b*100):0;}

/* ---------- db ---------- */
var EXG=60;
var COLS=['weeks','days','goals','stats','retros','meta','alerts','trips'];
function save(path,data,merge){
  if(!S.db){toast('저장소에 연결되지 않아 저장하지 못했습니다');return Promise.resolve(false);}
  var ref=S.db.doc(path);
  return (merge?ref.update(data):ref.set(data)).then(function(){return true;},function(e){
    toast(e&&e.code==='quota_exceeded'?'저장 공간이 가득 찼습니다':'저장하지 못했습니다. 잠시 후 다시 시도하세요');return false;});
}
function connect(tries){
  tries=tries||0;
  if(!window.claude||!window.claude.use){if(tries<15){setTimeout(function(){connect(tries+1);},200);return;}S.ready=true;render();return;}
  window.claude.use('sample').then(function(x){S.sample=x;if(x)render();});
  window.claude.use('mcp').then(function(x){S.mcp=x;if(x)render();});
  window.claude.use('db').then(function(db){
    S.db=db;
    if(!db){S.ready=true;render();return;}
    var pending=COLS.length;
    COLS.forEach(function(c){
      db.collection(c).onSnapshot(function(snap){
        var m={};snap.docs.forEach(function(d){var v=d.data();if(v){m[d.id]=Object.assign({_id:d.id},JSON.parse(JSON.stringify(v)));}});
        S[c]=m;
        if(pending>0){pending--;if(pending===0)S.ready=true;}
        render();
      },function(){S.ready=true;render();});
    });
    setTimeout(function(){if(!S.ready){S.ready=true;render();}},4000);
  });
}

/* ---------- derived ---------- */
function weekDoc(id){return S.weeks[id]||null;}
function weekStats(w){
  var t=0,d=0,per=DAYN.map(function(){return {t:0,d:0};});
  (w&&w.roles||[]).forEach(function(r){(r.rocks||[]).forEach(function(k){t++;var dd=Math.min(6,Math.max(0,k.day|0));per[dd].t++;if(k.done){d++;per[dd].d++;}});});
  return {total:t,done:d,pct:pct(d,t),per:per};
}
function dayAreas(day){
  var plan={},got={};
  (day&&day.blocks||[]).forEach(function(b){if(b.area==='move'||b.moved)return;var m=b.e-b.s;plan[b.area]=(plan[b.area]||0)+m;if(b.done)got[b.area]=(got[b.area]||0)+m;});
  return AREAS.map(function(a){var p=plan[a[0]]||0,g=got[a[0]]||0;return {key:a[0],name:a[1],plan:p,got:g,pct:pct(g,p)};});
}
function exMinutes(day){var m=0;(day&&day.blocks||[]).forEach(function(b){if(b.ex&&b.done)m+=b.e-b.s;});return m;}
function daysInWeek(wid){var w=S.weeks[wid];var mon=w&&w.monday?parseYmd(w.monday):null;if(!mon){var cw=curWeek();if(cw.id!==wid)return [];mon=cw.monday;}var out=[];for(var i=0;i<7;i++){var s=ymd(addDays(mon,i));if(S.days[s])out.push(S.days[s]);}return out;}
function weekAreas(wid){
  var plan={},got={};daysInWeek(wid).forEach(function(d){dayAreas(d).forEach(function(a){plan[a.key]=(plan[a.key]||0)+a.plan;got[a.key]=(got[a.key]||0)+a.got;});});
  return AREAS.map(function(a){return {name:a[1],pct:pct(got[a[0]]||0,plan[a[0]]||0),plan:plan[a[0]]||0};});
}
function sortedWeeks(){return Object.values(S.weeks).sort(function(a,b){return a._id<b._id?-1:1;});}

/* ---------- radar ---------- */
function radar(names,vals,prev,unit,aria){
  var W=300,H=260,R=82,n=names.length,cx=W/2,cy=H/2+(n===5?8:0);
  function pt(i,s){var a=-Math.PI/2+i*2*Math.PI/n;return [cx+R*s*Math.cos(a),cy+R*s*Math.sin(a)];}
  function ring(s){var p=[];for(var i=0;i<n;i++){var q=pt(i,s);p.push(q[0].toFixed(1)+','+q[1].toFixed(1));}return p.join(' ');}
  function poly(v){var p=[];for(var i=0;i<n;i++){var q=pt(i,Math.max(.03,Math.min(1,v[i]/100)));p.push(q[0].toFixed(1)+','+q[1].toFixed(1));}return p.join(' ');}
  var sp='',lbl='',dots='';
  for(var i=0;i<n;i++){var e=pt(i,1);sp+='M'+cx+','+cy+'L'+e[0].toFixed(1)+','+e[1].toFixed(1);
    var l=pt(i,1+30/R),dl=prev?vals[i]-prev[i]:0,sg=dl>0?' ▲'+dl:(dl<0?' ▼'+(-dl):'');
    lbl+='<span class="lb" style="left:'+Math.round(l[0]-38)+'px;top:'+Math.round(l[1]-16)+'px"><span>'+esc(names[i])+'</span><b class="num">'+vals[i]+unit+sg+'</b></span>';
    var d=pt(i,Math.max(.03,Math.min(1,vals[i]/100)));dots+='<span class="dot" style="left:'+Math.round(d[0]-4)+'px;top:'+Math.round(d[1]-4)+'px"></span>';}
  return '<div class="radar" role="img" aria-label="'+esc(aria)+'"><svg width="300" height="260" viewBox="0 0 300 260" aria-hidden="true">'+
    '<polygon points="'+ring(1)+'" style="fill:var(--field);stroke:var(--outline);stroke-width:1"/>'+
    [.75,.5,.25].map(function(s){return '<polygon points="'+ring(s)+'" style="fill:none;stroke:var(--grid);stroke-width:1"/>';}).join('')+
    '<path d="'+sp+'" style="stroke:var(--grid);stroke-width:1;fill:none"/>'+
    (prev?'<polygon points="'+poly(prev)+'" style="fill:none;stroke:var(--outline);stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round"/>':'')+
    '<polygon points="'+poly(vals)+'" style="fill:var(--accent);fill-opacity:.18;stroke:var(--accent);stroke-width:2;stroke-linejoin:round"/>'+
    '</svg>'+dots+lbl+'</div>';
}
function weakest(names,vals){var k=0;vals.forEach(function(v,i){if(v<vals[k])k=i;});return names[k];}

function gPeriod(g){

  var st=g.level==='year'?Date.UTC(y,0,1):Date.UTC(y,q*3,1),en=g.level==='year'?Date.UTC(y+1,0,1):Date.UTC(y,q*3+3,1);
  var lab=g.level==='year'?y+'년':y+' Q'+(q+1);
  return {st:st,en:en,label:lab,el:Math.max(0,Math.min(100,Math.round((kstNow().getTime()-st)/(en-st)*100))),left:Math.max(0,Math.ceil((en-kstNow().getTime())/864e5))};
}
function gF(g,f,sc){var o=g.scope==='both'&&g.byScope&&g.byScope[sc||curScope()];return o&&o[f]!=null?o[f]:g[f];}

var DAY0=420,DAY1=1260,PX=.8,BUF=5;
function freshMeeting(){var p=loadPrefs();return {scope:'local',title:'',query:'',place:null,travel:p.travel!=null?p.travel:20,dur:p.dur||60,day:null,base:null,pick:null};}
function nowMinFor(ds){if(ds!==todayStr())return 0;var n=kstNow();return n.getUTCHours()*60+n.getUTCMinutes()+15;}
function isRush(ds,depart){if(!ds)return false;var k=wd(parseYmd(ds));return k<5&&((depart>=420&&depart<540)||(depart>=1020&&depart<1140));}
function adjTravel(ds,s,travel){if(!travel)return 0;return isRush(ds,s-travel)?Math.round(travel*1.3/5)*5:travel;}
function prepMin(){return (S.meta.settings&&S.meta.settings.prepMin)||15;}
function alertsFor(s,tr){if(!tr)return [{at:s-10,kind:'online',sent:false}];var dep=s-tr;return [{at:dep-prepMin(),kind:'prep',sent:false},{at:dep,kind:'depart',sent:false}];}
function analyse(blocks,dur,travel,minS,ds){
  var out=[];for(var s=Math.ceil(Math.max(DAY0+travel+BUF,(minS||0)+travel)/30)*30;s+dur+travel+BUF<=DAY1;s+=30){
    var tr=adjTravel(ds,s,travel);if(s-tr<DAY0)continue;
    var a=s-tr,b=s+dur+tr,blocked=false,moved=[];
    blocks.forEach(function(k){if(k.area==='move')return;if(k.s<b+BUF&&k.e>a-BUF){if(k.p)blocked=true;else moved.push(k);}});
    if(blocked)continue;var prev=null,next=null;
    blocks.forEach(function(k){if(moved.indexOf(k)>=0||k.area==='move')return;if(k.e<=a&&(!prev||k.e>prev.e))prev=k;if(k.s>=b&&(!next||k.s<next.s))next=k;});
    var bf=a-(prev?prev.e:DAY0),af=(next?next.s:DAY1)-b;if(b>DAY1)continue;out.push({s:s,tr:tr,rush:tr!==travel,a:a,b:b,moved:moved,prev:prev,next:next,before:bf,after:af,score:(moved.length?0:1000)+Math.min(Math.min(bf,af),120)});}
  return out;
}
function rateOf(c){if(c.moved.length)return ['일정 이동','warn'];var m=Math.min(c.before,c.after);return m>=30?['여유','good']:(m>=10?['적당','mid']:['빠듯','warn']);}

function backupCard(){
  return '<section class="card" style="gap:10px"><span class="label">이 기기의 기록</span>'+
    '<p class="small muted" style="margin:0">기록은 서버가 아닌 이 기기의 브라우저에만 저장됩니다. 기기를 바꾸거나 브라우저 데이터를 지우기 전에 백업 파일을 받아 두세요.</p>'+
    '<div class="grid2"><button class="btn" data-act="wlbackup">백업 파일 받기</button><button class="btn" data-act="wlrestore">백업에서 복원</button></div>'+
    notifRow()+'<a class="xs muted" href="privacy.html">개인정보 처리방침</a></section>';
}
VIEWS.goals=(function(f){return function(){return f()+backupCard();};})(VIEWS.goals);
function wlBackup(){
  var data={};wlKeys().forEach(function(k){try{data[k.slice(WL.P.length)]=JSON.parse(localStorage.getItem(k));}catch(e){}});
  var blob=new Blob([JSON.stringify({app:'WEEKLINE',version:1,exported:new Date().toISOString(),data:data})],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='weekline-backup-'+todayStr()+'.json';document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);toast('백업 파일을 저장했습니다');
}
function wlRestore(){
  var inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
  inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){var j;try{j=JSON.parse(r.result);}catch(e){toast('백업 파일을 읽지 못했습니다');return;}
      if(!j||j.app!=='WEEKLINE'||!j.data||typeof j.data!=='object'){toast('WEEKLINE 백업 파일이 아닙니다');return;}
      if(!confirm('지금 이 기기의 기록을 백업 파일 내용으로 바꿉니다. 계속할까요?'))return;
      var old=wlKeys();
      try{old.forEach(function(k){localStorage.removeItem(k);});
        Object.keys(j.data).forEach(function(p){if(COLS.indexOf(p.split('/')[0])>=0)localStorage.setItem(WL.P+p,JSON.stringify(j.data[p]));});}
      catch(e){toast('저장 공간이 부족해 복원하지 못했습니다');return;}
      COLS.forEach(function(c){WL.emit(c);});toast('백업에서 복원했습니다');};
    r.readAsText(f);};
  inp.click();
}
function wlNotify(text,tag){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  var opt={body:text,tag:tag,icon:'icon-192.png',badge:'icon-192.png'};
  if(navigator.serviceWorker&&navigator.serviceWorker.controller){navigator.serviceWorker.ready.then(function(r){r.showNotification('WEEKLINE',opt);});}
  else{try{new Notification('WEEKLINE',opt);}catch(e){}}
}
function wlTick(){
  var d=todayStr(),doc=S.alerts&&S.alerts[d];if(!doc||!doc.items)return;
  var n=kstNow(),m=n.getUTCHours()*60+n.getUTCMinutes(),ch=false;
  doc.items.forEach(function(a){if(!a.sent&&a.at<=m&&m-a.at<=10){wlNotify(a.text,a.id);a.sent=true;ch=true;}});
  if(ch)save('alerts/'+d,{items:doc.items});
}
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-act^="wl"]');if(!b)return;var a=b.getAttribute('data-act');
  if(a==='wlbackup')wlBackup();
  else if(a==='wlrestore')wlRestore();
  else if(a==='wlnotif'&&'Notification' in window){Notification.requestPermission().then(function(p){toast(p==='granted'?'미팅 알림을 켰습니다':'알림이 허용되지 않았습니다');render();});}
});
setInterval(wlTick,30000);setTimeout(wlTick,3000);
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js');});}

S.ui.meeting=freshMeeting();applyZoom();render();connect();
})();
</script>
